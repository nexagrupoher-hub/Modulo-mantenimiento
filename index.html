<style>
:root{
  --acento:#8c1d2c;
  --acento-suave:#f6eaec;
  --acento-borde:#e6ccd1;
  --acento-oscuro:#6d1522;
  --fondo:#f4f5f7;
  --tarjeta:#ffffff;
  --t1:#1f2328;
  --t2:#4a5057;
  --t3:#8a9099;
  --linea:#e7e9ec;
  --ok:#1e7a52; --ok-bg:#e9f4ee;
  --alerta:#8a5b00; --alerta-bg:#fbf2e0;
  --mal:#9b2c2c; --mal-bg:#fbecec;
  --info:#1a4f8a; --info-bg:#e9f0f8;

*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--t1);font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--t1)}
a{color:var(--acento);text-decoration:none}
.filo{height:3px;background:var(--acento-oscuro)}
header.top{background:linear-gradient(90deg,var(--acento),var(--acento-oscuro));color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(16,24,40,.18)}
header.top .marca b{color:#fff}
header.top .marca span{color:rgba(255,255,255,.72)}
header.top .marca .iso{background:#fff;color:var(--acento);box-shadow:0 1px 3px rgba(0,0,0,.2)}
header.top .logoemp{background:#fff;border-radius:7px;padding:4px 8px;height:38px;max-width:150px}
header.top select{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
header.top select option{color:var(--t1)}
header.top .est{color:rgba(255,255,255,.85)}
header.top .pt{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
header.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
header.top .btn:hover{background:rgba(255,255,255,.22);border-color:#fff;color:#fff}
.top-in{padding:9px 16px 9px 14px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:10px;min-width:230px}
.marca .iso{width:34px;height:34px;border-radius:9px;background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.marca b{display:block;font-size:14px;letter-spacing:.2px}
.marca span{display:block;font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px}
.top-sp{flex:1}
.top-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.layout{display:flex;align-items:flex-start}
aside.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--linea);min-height:calc(100vh - 62px);position:sticky;top:56px;padding:14px 10px 40px;overflow:auto;max-height:calc(100vh - 56px)}
.side .sec{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);font-weight:700;padding:16px 12px 6px}
.side .grupo{font-size:13.5px;font-weight:700;color:var(--t1);padding:12px 12px 5px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--t2);cursor:pointer;font-size:13px;line-height:1.25}
.side a:hover{background:#f5f6f8;color:var(--t1)}
.side a.on{background:var(--acento-suave);color:var(--acento);font-weight:600}
.side a.on .ico{stroke:var(--acento)}
.side a .ico{stroke:var(--t3);flex:none}
.side a.falta{color:var(--t3)}
.side a .pend{margin-left:auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;background:#f0f1f3;color:var(--t3);border-radius:5px;padding:1px 5px}
main{flex:1;min-width:0;max-width:1240px;padding:20px 22px 70px}
@media(max-width:900px){.layout{display:block}aside.side{width:auto;position:static;max-height:none;min-height:0;border-right:0;border-bottom:1px solid var(--linea);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
 .side .sec,.side .grupo{width:100%;padding:8px 10px 2px}.side a{padding:7px 10px}}
.h1{font-size:20px;font-weight:700;margin:0 0 2px}
.sub{color:var(--t3);margin:0 0 18px;font-size:12.5px}
.card{background:var(--tarjeta);border-radius:12px;box-shadow:var(--sombra);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.kpi{background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:14px 16px}

.kpi .nu{font-size:26px;font-weight:700;margin-top:5px;letter-spacing:-.5px}
.kpi .pie{font-size:11.5px;color:var(--t3);margin-top:3px}
.kpi.aviso .nu{color:var(--mal)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f2f4;color:var(--t2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td b{color:var(--t1);font-weight:600}
.tabla-wrap{overflow-x:auto;margin:0 -6px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#f0f1f3;color:var(--t2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.al{background:var(--alerta-bg);color:var(--alerta)}
.chip.ma{background:var(--mal-bg);color:var(--mal)}
.chip.in{background:var(--info-bg);color:var(--info)}
.chip.ac{background:var(--acento-suave);color:var(--acento)}
.btn{border:1px solid var(--linea);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;color:var(--t2);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#d5d8dd;color:var(--t1)}
.btn.pri{background:var(--acento);border-color:var(--acento);color:#fff}

.btn.chico{padding:5px 10px;font-size:12px;border-radius:8px}

label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
textarea{min-height:64px;resize:vertical}
.campo{margin-bottom:11px}
.fila{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.42);display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;z-index:80;overflow:auto}
.modal{background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(16,24,40,.22);width:100%;max-width:860px}
.modal.ancho{max-width:1080px}
.modal.angosto{max-width:440px}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px}
.modal-h b{font-size:15px}
.modal-b{padding:18px 20px;max-height:70vh;overflow:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--linea);display:flex;gap:9px;justify-content:flex-end;background:#fbfbfc;border-radius:0 0 14px 14px}
.vacio{text-align:center;padding:34px 18px;color:var(--t3)}
.vacio b{display:block;color:var(--t2);margin-bottom:5px;font-size:14px}
.est{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3)}
.pt{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.pt.v{background:var(--ok)} .pt.r{background:var(--mal)} .pt.a{background:var(--alerta)}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--linea);margin:-4px 0 14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 13px;cursor:pointer;color:var(--t3);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acento);border-bottom-color:var(--acento)}
.barra{height:6px;background:#eef0f2;border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--acento)}
.mini{font-size:11.5px;color:var(--t3)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--acento-oscuro) url('https://grupoher.com.ar/wp-content/uploads/2026/07/banner-movilidad-en-crecimiento-v2-1-scaled.png') center/cover no-repeat}
.login-wrap:before{content:'';position:fixed;inset:0;background:linear-gradient(160deg,rgba(140,29,44,.78) 0%,rgba(60,10,18,.82) 100%);pointer-events:none}
.login-wrap .login{position:relative}
.login{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.30);padding:30px;width:100%;max-width:390px;text-align:center}
.login .iso{width:52px;height:52px;border-radius:14px;background:var(--acento);color:#fff;box-shadow:0 6px 16px var(--acento-borde);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;margin:0 auto 12px}
.login h1{font-size:19px;margin:0 0 3px}
.login p{color:var(--t3);margin:0 0 20px;font-size:12.5px}
.pin{letter-spacing:8px;text-align:center;font-size:19px}
.err{background:var(--mal-bg);color:var(--mal);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;font-weight:600}
.aviso{background:var(--alerta-bg);color:var(--alerta);padding:10px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.soltar{border:2px dashed var(--linea);border-radius:12px;padding:26px 18px;text-align:center;color:var(--t3);background:#fbfbfc;cursor:pointer}
.soltar:hover{border-color:var(--acento);color:var(--acento);background:var(--acento-suave)}
.soltar b{display:block;color:var(--t1);font-size:14px;margin-bottom:4px}
.mapeo{font-size:11.5px;color:var(--t3);margin-top:10px}
.mapeo span{display:inline-block;background:#f0f1f3;border-radius:6px;padding:2px 8px;margin:2px}
.mapeo span.no{background:var(--mal-bg);color:var(--mal)}
.logoemp{height:30px;max-width:120px;object-fit:contain}
.lista-doc{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;cursor:pointer;background:#fff}
.doc:hover{border-color:#d5d8dd;background:#fafbfc}
.doc .cre{flex:1;min-width:0}
.doc .cre b{display:block;font-size:13px}
.doc .cre span{font-size:11.5px;color:var(--t3)}
@media(max-width:700px){.marca{min-width:0}.marca span{display:none}main{padding:14px 12px 60px}}
</style>

<script>
/* =====================================================================
   GESTIÓN DE FLOTA · app web · v1.0
   Un solo archivo, sin librerías. Habla con la planilla "Gestión de Flota"
   a través de gestion-de-flota.gs (menú → Implementar → Aplicación web).
   ===================================================================== */

var API_URL_DEFAULT = '';                 // pegar acá la URL /exec para que arranque sola
var LS = { api:'GF_API', cache:'GF_CACHE', ses:'GF_SESION', acento:'GF_ACENTO', emp:'GF_EMPRESA' };

/* --------------------------- estado global --------------------------- */
var S = {
  api: localStorage.getItem(LS.api) || API_URL_DEFAULT,
  db: {}, version: 0, planilla: '', conectado: false, cargando: false,
  usuario: null, empresa: '', vista: 'panel', sub: '', error: '', ultimo: '',
  periodo: '3', buscar: '', filtroEstado: '',
  sucio: {}, guardando: false, modal: null
};

/* ------------------------------ utilidades --------------------------- */
function $(s,c){ return (c||document).querySelector(s); }
function el(t,p,h){ var e=document.createElement(t); if(p) for(var k in p){ if(k==='cls') e.className=p[k]; else if(k.indexOf('on')===0) e.addEventListener(k.substring(2),p[k]); else if(p[k]!==null&&p[k]!==undefined) e.setAttribute(k,p[k]); } if(h!==undefined&&h!==null) e.innerHTML=h; return e; }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(v){ if(typeof v==='number') return v; if(v===''||v===null||v===undefined) return 0;
  var s=String(v).trim().replace(/[^0-9,.\-]/g,''); var p=s.indexOf('.')>=0, c=s.indexOf(',')>=0;
  if(p&&c) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(c) s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,'') : s.replace(',','.');
  else if(p && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');   /* 446.000 son 446 mil, no 446 */
  var n=parseFloat(s); return isNaN(n)?0:n; }
function pesos(v){ return '$' + num(v).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function miles(v){ return num(v).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function fecha(f){ if(!f) return ''; var m=String(f).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : String(f); }
function dias(desde,hasta){ if(!desde) return 0; var a=new Date(desde+'T00:00:00'), b=hasta?new Date(hasta+'T00:00:00'):new Date();
  return Math.round((b-a)/86400000); }
function T(h){ return (S.db[h]||[]); }
function idNuevo(){ return String(Date.now())+String(Math.floor(Math.random()*1000)); }
function ico(d){ return '<svg class="ico" viewBox="0 0 24 24">'+d+'</svg>'; }
var ICO = {
  panel:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  bus:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M3 11h18M7 17v2M17 17v2"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/>',
  llave:'<path d="M14.7 6.3a4 4 0 1 0 3 3L21 6l-2-2-3.3 2.3z"/><path d="M11.7 9.3 3 18l3 3 8.7-8.7"/>',
  caja:'<path d="M21 8v12H3V8M1 4h22v4H1zM10 12h4"/>',
  carro:'<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M1 2h3l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 7H6"/>',
  gente:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
  eng:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 8a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 3.6h.1A2 2 0 1 1 13 3v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  refrescar:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  mas:'<path d="M12 5v14M5 12h14"/>',
  hoja:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  mapa:'<path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3z"/><path d="M9 3v15M15 6v15"/>',
  pin:'<path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  campana:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  peso:'<path d="M12 3v18M8 8h6a3 3 0 0 1 0 6H8M6 12h9"/>',
  edificio:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h6"/>',
  libro:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  lista:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  alerta:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'
};

/* ------------------------------- conexión ---------------------------- */
function apiGet(params, cb, cbErr){
  if(!S.api) return cbErr && cbErr('Falta la dirección del script.');
  var p2 = { gf: params.accion || 'leer' };
  Object.keys(params).forEach(function(k){ if(k!=='accion') p2[k]=params[k]; });
  var q = Object.keys(p2).map(function(k){ return k+'='+encodeURIComponent(p2[k]); }).join('&');
  fetch(S.api+'?'+q).then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.ok===false) return cbErr && cbErr(j.error||'La planilla devolvió un error.'); cb(j); })
    .catch(function(e){ cbErr && cbErr('No se pudo hablar con la planilla: '+e.message); });
}
function apiPost(cuerpo, cb, cbErr){
  if(!S.api) return cbErr && cbErr('Falta la dirección del script.');
  cuerpo.gf = cuerpo.accion || 'guardarTodo';   /* rama del sistema nuevo en el conector unificado */
  fetch(S.api, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.ok===false) return cbErr && cbErr(j.error||'No se pudo guardar.', j); cb(j); })
    .catch(function(e){ cbErr && cbErr('No se pudo guardar: '+e.message); });
}

function traer(cb){
  S.cargando = true; S.error=''; pintar();
  apiGet({ accion:'leer' }, function(j){
    S.db = j.datos || {}; S.version = Number(j.version_datos||1); S.planilla = j.planilla||'';
    S.conectado = true; S.cargando = false; S.ultimo = new Date().toLocaleTimeString('es-AR');
    try{ localStorage.setItem(LS.cache, JSON.stringify({db:S.db, version:S.version, planilla:S.planilla, cuando:Date.now()})); }catch(e){}
    if(!S.empresa){ var e0 = T('Empresas')[0]; S.empresa = localStorage.getItem(LS.emp) || (e0?e0.codigo:''); }
    indexar(); S.cargando=false; pintar(); cb && cb();
  }, function(err){
    S.cargando = false; S.error = err;
    var c = localStorage.getItem(LS.cache);
    if(c && !Object.keys(S.db).length){ try{ var j2=JSON.parse(c); S.db=j2.db; S.version=j2.version; S.planilla=j2.planilla; }catch(e){} }
    pintar();
  });
}

function guardar(hojas, cb){

  var pend = Object.keys(S.sucio);
  if(!pend.length) return cb && cb();
  var datos = {}; pend.forEach(function(h){ datos[h] = S.db[h]||[]; });
  S.guardando = true; pintar();
  apiPost({ accion:'guardarTodo', version:S.version, usuario:(S.usuario?S.usuario.nombre:''), datos:datos },
    function(j){ S.version = Number(j.version_datos||S.version+1); S.sucio={}; S.guardando=false; S.ultimo=new Date().toLocaleTimeString('es-AR');
      try{ localStorage.setItem(LS.cache, JSON.stringify({db:S.db, version:S.version, planilla:S.planilla, cuando:Date.now()})); }catch(e){}
      pintar(); cb && cb(); },
    function(err, j){ S.guardando=false;
      if(j && j.conflicto) S.error='Alguien más guardó en la planilla mientras trabajabas. Apretá Actualizar y volvé a cargarlo.';
      else S.error = err;

}

/* =====================================================================
   CAPA DE DATOS
   La planilla usa TUS nombres: en Vehiculos el interno es la columna
   "vehiculo" y el odómetro es "km"; las hojas hijas apuntan con
   vehiculo_id y traen Unidad/Patente al final. Acá se resuelve todo eso
   una sola vez y el resto de la app trabaja con el interno.
   ===================================================================== */
var IX = { vehId:{}, vehInt:{}, vehPat:{}, empId:{}, empCod:{}, condId:{}, condDni:{}, persLeg:{} };
function indexar(){
  IX = { vehId:{}, vehInt:{}, vehPat:{}, empId:{}, empCod:{}, condId:{}, condDni:{}, persLeg:{} };
  T('Vehiculos').forEach(function(v){
    if(v.id) IX.vehId[String(v.id)] = v;
    if(v.vehiculo) IX.vehInt[String(v.vehiculo).trim()] = v;
    if(v.patente) IX.vehPat[normTexto(v.patente)] = v;
  });
  T('Empresas').forEach(function(e){
    if(e.id) IX.empId[String(e.id)] = e;
    if(e.codigo) IX.empCod[String(e.codigo).trim().toUpperCase()] = e;
  });
  T('Conductores').forEach(function(c){ if(c.id) IX.condId[String(c.id)]=c; if(c.dni) IX.condDni[String(c.dni)]=c; });
  T('Personal').forEach(function(p){ if(p.legajo) IX.persLeg[String(p.legajo)]=p; });
}
function unidad(interno){ return IX.vehInt[String(interno||'').trim()] || null; }
/* de cualquier fila saca la unidad: por interno, por vehiculo_id o por patente */
function unidadDe(r){
  if(!r) return null;
  if(r.interno && IX.vehInt[String(r.interno).trim()]) return IX.vehInt[String(r.interno).trim()];
  if(r.Unidad && IX.vehInt[String(r.Unidad).trim()]) return IX.vehInt[String(r.Unidad).trim()];
  if(r.vehiculo_id && IX.vehId[String(r.vehiculo_id)]) return IX.vehId[String(r.vehiculo_id)];
  var pat = r.patente || r.dominio || r.Patente;
  if(pat && IX.vehPat[normTexto(pat)]) return IX.vehPat[normTexto(pat)];
  return null;
}
function internoDe(r){ var v = unidadDe(r); return v ? String(v.vehiculo) : String(r.interno || r.Unidad || ''); }
function empCod(r){
  if(!r) return '';
  if(r.empresa) return String(r.empresa).toUpperCase();
  if(r.empresa_id && IX.empId[String(r.empresa_id)]) return String(IX.empId[String(r.empresa_id)].codigo||'').toUpperCase();
  var v = unidadDe(r);
  if(v && v.empresa_id && IX.empId[String(v.empresa_id)]) return String(IX.empId[String(v.empresa_id)].codigo||'').toUpperCase();
  return '';
}
function empNombre(cod){ var e = IX.empCod[String(cod||'').toUpperCase()]; return e ? e.nombre : cod; }
function porEmpresa(filas){
  if(!S.empresa || S.empresa==='*') return filas;
  return filas.filter(function(f){ var c = empCod(f); return !c || c === S.empresa; });
}

/* ---------------------- kilómetros: una sola fuente ------------------ */
function lecturasDe(interno){
  var v = unidad(interno), l = [];
  T('Combustible').forEach(function(c){
    if(internoDe(c)!==String(interno)) return;
    if(num(c.km_carga)) l.push({ f:String(c.fecha), km:num(c.km_carga) });
  });
  T('Lecturas').forEach(function(c){ if(String(c.interno)===String(interno) && num(c.km)) l.push({f:String(c.fecha), km:num(c.km)}); });
  T('OT').forEach(function(c){ if(String(c.interno)===String(interno) && num(c.odometro)) l.push({f:String(c.fecha_apertura), km:num(c.odometro)}); });
  T('Partes').forEach(function(c){ if(internoDe(c)===String(interno) && num(c.kmFinal)) l.push({f:String(c.fecha), km:num(c.kmFinal)}); });
  T('Checks').forEach(function(c){ if(String(c.interno)===String(interno)){
    if(num(c.kmsFinales)) l.push({f:String(c.fecha), km:num(c.kmsFinales)});
    else if(num(c.kmsIniciales)) l.push({f:String(c.fecha), km:num(c.kmsIniciales)});
  }});
  if(v && num(v.km)) l.push({ f:'9999-12-31', km:num(v.km) });
  return l.sort(function(a,b){ return a.f<b.f?-1:1; });
}
function kmActual(interno){
  var k = 0;
  lecturasDe(interno).forEach(function(x){ k = Math.max(k, x.km); });
  return k;
}
function kmDelPeriodo(interno){
  var l = lecturasDe(interno).filter(function(x){ return x.f !== '9999-12-31'; });
  var d = desdePeriodo();
  var dentro = l.filter(function(x){ return x.f >= d; });
  if(!dentro.length) return 0;
  var antes = l.filter(function(x){ return x.f < d; });
  var base = antes.length ? antes[antes.length-1].km : dentro[0].km;
  return Math.max(0, dentro[dentro.length-1].km - base);
}
function consumoReal(interno){
  var cargas = [];
  T('Combustible').forEach(function(c){ if(internoDe(c)===String(interno) && num(c.litros) && num(c.km_carga)) cargas.push(c); });
  if(cargas.length<2) return 0;
  cargas.sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; });
  var km = num(cargas[cargas.length-1].km_carga) - num(cargas[0].km_carga);
  var litros = 0;
  for(var i=1;i<cargas.length;i++) litros += num(cargas[i].litros);
  return (km>0 && litros>0) ? (litros*100/km) : 0;
}

/* --------------- plan de mantenimiento (PlanMant + PlanUnidades) ----- */
function jsonSeguro(v){ if(!v) return []; if(typeof v==='object') return v; try{ var x=JSON.parse(v); return x&&x.length?x:[]; }catch(e){ return []; } }
function planDe(interno){
  var pu = null;
  T('PlanUnidades').forEach(function(p){ if(String(p.interno).trim()===String(interno).trim()) pu=p; });
  if(!pu) return null;
  var pm = null;
  T('PlanMant').forEach(function(p){ if(String(p.id)===String(pu.planId)) pm=p; });
  return { unidad:pu, plan:pm, servicios:jsonSeguro(pm&&pm.servicios), ultimos:jsonSeguro(pu.ultimos) };
}
function proximoServicio(v){
  var interno = v.vehiculo || v.interno;
  var p = planDe(interno);
  if(!p || !p.servicios.length) return null;
  var km = kmActual(interno), mejor = null;
  p.servicios.forEach(function(sv){
    var inter = num(sv.km || sv.intervalo);
    if(!inter) return;
    var ult = 0;
    p.ultimos.forEach(function(u){ if(String(u.codigo)===String(sv.codigo)) ult = Math.max(ult, num(u.km)); });
    var proximo = ult ? ult + inter : Math.ceil((km||1)/inter)*inter;
    var falta = proximo - km;
    if(!mejor || falta < mejor.falta) mejor = { falta:falta, codigo:sv.codigo, desc:sv.descripcion||'', proximo:proximo, tol:num(sv.tolerancia)||1000 };
  });
  return mejor;
}

/* -------------------------- pañol (hojas nuevas) --------------------- */
function stockMapa(){
  var m = {};
  T('Movimientos').forEach(function(v){
    if(!v.articulo) return;
    var k = v.empresa+'|'+v.base+'|'+v.articulo;
    if(!m[k]) m[k] = { empresa:v.empresa, base:v.base, articulo:v.articulo, cant:0, costo:0, ult:'' };
    m[k].cant += num(v.cantidad);
    if(num(v.costo_unit)) m[k].costo = num(v.costo_unit);
    if(v.fecha > m[k].ult) m[k].ult = v.fecha;
  });
  return m;
}
function stockLista(){
  var m = stockMapa(), art = {}, par = {};
  T('Articulos').forEach(function(a){ art[a.codigo]=a; });
  T('StockParam').forEach(function(p){ par[p.articulo+'|'+p.empresa+'|'+p.base]=p; });
  return Object.keys(m).map(function(k){
    var r = m[k], a = art[r.articulo]||{}, p = par[r.articulo+'|'+r.empresa+'|'+r.base]||{};
    r.desc = a.descripcion||''; r.um = a.um||''; r.criticidad = a.criticidad||'';
    r.minimo = num(p.minimo); r.maximo = num(p.maximo); r.ubicacion = p.ubicacion||'';
    r.valor = r.cant * (r.costo || num(a.costo_referencia));
    r.bajo = r.minimo>0 && r.cant < r.minimo;
    return r;
  }).sort(function(a,b){ return (a.ubicacion||'zzz').localeCompare(b.ubicacion||'zzz'); });
}
function mesActual(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function desdePeriodo(){
  if(S.periodo==='todo') return '0000-00-00';
  var d = new Date();
  if(S.periodo==='mes') return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-01';
  d.setMonth(d.getMonth() - (S.periodo==='6' ? 5 : 2));
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-01';
}
function nombrePeriodo(){
  return S.periodo==='mes' ? 'este mes' : (S.periodo==='6' ? 'últimos 6 meses' : (S.periodo==='todo' ? 'todo el historial' : 'últimos 3 meses'));
}

/* vencimientos: los de la hoja Documentacion y los que viven en Vehiculos */
function vencimientos(){
  var out = [], ya = {};
  T('Documentacion').forEach(function(d){
    if(!d.vencimiento) return;
    ya[normTexto(d.referencia)+'|'+normTexto(d.tipo)] = true;
    out.push({ ref:d.referencia, tipo:d.tipo, vence:String(d.vencimiento), origen:'Documentacion', fila:d });
  });
  T('Vehiculos').forEach(function(v){
    [['vencimientoVTV','VTV / RTO'],['vencimientoSeguro','Seguro'],['vencimientoOblea','Oblea GNC'],['vencimientoVTV2','VTV 2ª jurisdicción']].forEach(function(c){
      if(!v[c[0]]) return;
      if(ya[normTexto(v.vehiculo)+'|'+normTexto(c[1])]) return;   /* ya está en Documentacion */
      out.push({ ref:v.vehiculo, tipo:c[1], vence:String(v[c[0]]), origen:'Vehiculos', fila:v });
    });
  });
  T('Conductores').forEach(function(c){

  });
  return out.sort(function(a,b){ return a.vence<b.vence?-1:1; });
}

  stockLista().forEach(function(x){

  });
  T('Devoluciones').forEach(function(d){

      a.push({n:'al', t:'Devolución '+d.numero+' abierta', d:d.proveedor+' · '+pesos(d.importe)+' · '+d.motivo, ir:'recepciones'});
  });
  T('Partes').forEach(function(p){ if(String(p.firmado)!=='Sí') a.push({n:'al', t:'Parte sin firmar', d:'Interno '+internoDe(p)+' · '+fecha(p.fecha)+' · '+(p.operador||''), ir:'partes'}); });
  T('PedidosInsumos').forEach(function(p){ if(!/entregado|cerrado/i.test(String(p.estado||''))) a.push({n:'al', t:'Pedido de insumos sin resolver', d:(p.conductor||'')+' · interno '+(p.interno||'')+' · '+fecha(p.fecha), ir:'appconductor'}); });
  T('Checks').forEach(function(c){ if(c.comentarios && !c.ot_id) a.push({n:'ma', t:'Novedad de conductor sin O.T.', d:'Interno '+c.interno+' · '+String(c.comentarios).substring(0,70), ir:'controldiario'}); });
  var orden = { ma:0, al:1, in:2 };

/* del acento salen los tonos claros, para no tener que elegir 4 colores */
function tonos(){
  var hex = (localStorage.getItem(LS.acento) || '#8c1d2c').replace('#','');
  if(hex.length!==6) return;
  var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  var mez = function(p){ return 'rgb('+Math.round(r+(255-r)*p)+','+Math.round(g+(255-g)*p)+','+Math.round(b+(255-b)*p)+')'; };
  document.documentElement.style.setProperty('--acento-suave', mez(.92));
  document.documentElement.style.setProperty('--acento-borde', mez(.78));
  var osc = function(p){ return 'rgb('+Math.round(r*(1-p))+','+Math.round(g*(1-p))+','+Math.round(b*(1-p))+')'; };
  document.documentElement.style.setProperty('--acento-oscuro', osc(.22));
}

/* tabla genérica: cols = [[clave, título, tipo]] tipo: t|n|$|chip|fecha */
function tabla(filas, cols, alClic){
  var w = el('div',{cls:'tabla-wrap'});
  if(!filas.length){ w.appendChild(el('div',{cls:'vacio'},'<b>Todavía no hay nada cargado</b>Cuando cargues el primer registro aparece acá.')); return w; }
  var t = el('table');
  var thead = el('thead'); var tr = el('tr');
  cols.forEach(function(c){ tr.appendChild(el('th',{cls:(c[2]==='n'||c[2]==='$')?'n':''}, esc(c[1]))); });
  thead.appendChild(tr); t.appendChild(thead);
  var tb = el('tbody');
  filas.forEach(function(f){
    var r = el('tr', alClic?{style:'cursor:pointer', onclick:function(){ alClic(f); }}:{});
    cols.forEach(function(c){
      var v = f[c[0]], h;
      if(c[2]==='$') h = pesos(v);
      else if(c[2]==='n') h = miles(v);
      else if(c[2]==='fecha') h = fecha(v);
      else if(c[2]==='chip') h = v ? '<span class="chip '+claseEstado(v)+'">'+esc(v)+'</span>' : '';
      else if(c[2]==='b') h = '<b>'+esc(v)+'</b>';
      else h = esc(v);
      r.appendChild(el('td',{cls:(c[2]==='n'||c[2]==='$')?'n':''}, h));
    });
    tb.appendChild(r);
  });
  t.appendChild(tb); w.appendChild(t);
  return w;
}

function claseEstado(v){
  v = String(v);
  if(/Cerrad|Recibida$|Aceptada$|Vigente|Operativa|Activo|Sí|Conciliada|Pagada|Hecha|Apto$/.test(v)) return 'ok';
  if(/Espera|Esperando|En tránsito|parcial|Por vencer|Emitida|Abierta|En ejecución|Pendiente|Borrador|observación/.test(v)) return 'al';
  if(/Anulad|Rechazad|Vencido|Fuera de servicio|diferencia|Crítica|Siniestrada|Baja/.test(v)) return 'ma';
  if(/En taller|En curso|Alta/.test(v)) return 'in';
  return '';
}

function vistaProgramados(m){
  encabezado(m,'Programados','Planilla de viajes: origen, destino, interno y choferes',
    [btnMasiva('Programados'), btnNuevo('Programados','Nuevo viaje',{estado:'Programado', clase:'Turismo', empresa:(S.empresa!=='*'?S.empresa:'')})]);
  var vs = T('Programados').filter(function(v){ return enPeriodo(v.fechaInicio); });

  var rutas = {}; T('Rutas').forEach(function(r){ rutas[String(r.origen).toUpperCase()+'|'+String(r.destino).toUpperCase()] = num(r.km); });
  var kmDe = function(v){
    if(num(v.kmManual)) return num(v.kmManual);
    var k = rutas[String(v.origen).toUpperCase()+'|'+String(v.destino).toUpperCase()];
    if(!k) k = rutas[String(v.destino).toUpperCase()+'|'+String(v.origen).toUpperCase()];
    return num(k);
  };
  var sinKm = vs.filter(function(v){ return !kmDe(v); });
  var sinCoord = T('Localidades').filter(function(l){ return !num(l.lat) || !num(l.lng); });
  var g = el('div',{cls:'grid g4'});
  g.appendChild(kpi('Viajes', miles(vs.length), nombrePeriodo()));
  g.appendChild(kpi('Kilómetros', miles(vs.reduce(function(a,v){ return a+kmDe(v); },0)), 'según rutas cargadas'));
  g.appendChild(kpi('Sin km', miles(sinKm.length), 'falta la ruta o el km manual', sinKm.length>0));
  g.appendChild(kpi('Unidades en viaje', miles(Object.keys(vs.reduce(function(a,v){ if(v.interno) a[v.interno]=1; return a; },{})).length), 'internos distintos'));
  m.appendChild(g);
  if(sinCoord.length) m.appendChild(el('div',{cls:'aviso'},
    'Localidades sin coordenadas: '+sinCoord.map(function(l){ return esc(l.codigo||l.nombre); }).join(', ')+'. Sin lat/lng los kilómetros dan 0.'));

  var tab = S.sub || 'planilla';
  tabs(m,[['planilla','Planilla'],['unidades','Por unidad'],['locs','Localidades y rutas']], tab, function(v){ S.sub=v; pintar(); });
  if(tab==='planilla'){
    carta(m, tabla(vs.slice().sort(function(a,b){ return String(a.fechaInicio)<String(b.fechaInicio)?-1:1; }).map(function(v){
      var o=Object.create(v); o._km = kmDe(v); o._ruta = (v.origen||'')+' → '+(v.destino||''); return o; }),
      [['fechaInicio','Sale','fecha'],['fechaFin','Llega','fecha'],['hora','Hora'],['codigo','Código','b'],
       ['_ruta','Recorrido'],['interno','Interno'],['chofer1','Chofer 1'],['chofer2','Chofer 2'],
       ['contratante','Contratante'],['_km','Km','n'],['estado','Estado','chip']],
      function(f){ formGenerico('Programados', f); }));
  } else if(tab==='unidades'){
    var porU = {};
    vs.forEach(function(v){ var k=v.interno||'(sin unidad)'; if(!porU[k]) porU[k]={interno:k, viajes:0, km:0, dias:0};
      porU[k].viajes++; porU[k].km += kmDe(v);
      var d = dias(v.fechaInicio, v.fechaFin||v.fechaInicio); porU[k].dias += (d>0?d:1); });
    carta(m, tabla(Object.keys(porU).map(function(k){ return porU[k]; }).sort(function(a,b){ return b.viajes-a.viajes; }),
      [['interno','Interno','b'],['viajes','Viajes','n'],['km','Kilómetros','n'],['dias','Días en viaje','n']],
      function(f){ if(unidad(f.interno)) fichaUnidad(f.interno); }), 'Ocupación por unidad · '+nombrePeriodo());
  } else {
    carta(m, tabla(T('Localidades'), [['codigo','Código','b'],['nombre','Nombre'],['prov','Provincia'],
      ['lat','Lat','n'],['lng','Lng','n'],['base','Base'],['exterior','Exterior']],
      function(f){ formGenerico('Localidades', f); }), 'Localidades');
    carta(m, tabla(T('Rutas'), [['origen','Origen','b'],['destino','Destino'],['km','Km','n'],['estimado','Estimado']],
      function(f){ formGenerico('Rutas', f); }), 'Rutas');
  }
}

function vistaPlan(m){
  encabezado(m,'Plan de mantenimiento','Qué le toca a cada unidad y cuánto falta para el próximo servicio',
    [btnNuevo('PlanTurnos','Pedir turno',{estado:'Pedido', fecha:hoy()}),
     btnNuevo('PlanUnidades','Asignar unidad a un plan',{})]);

  var vs = porEmpresa(T('Vehiculos'));
  var prox = vs.map(function(v){
    var interno = v.vehiculo, ps = proximoServicio(v), km = kmActual(interno), p = planDe(interno);
    return { interno:interno, patente:v.patente, base:v.base||'', plan:(p&&p.plan)?p.plan.nombre:'', _km:km,
      _serv: ps? ps.codigo : '', _falta: ps? ps.falta : null,
      _est: !p ? 'Sin plan' : (ps && ps.falta <= 0 ? 'Vencido' : (ps && ps.falta < ps.tol ? 'Pedir turno' : 'Al día')) };
  }).sort(function(a,b){ return (a._falta===null?9e9:a._falta) - (b._falta===null?9e9:b._falta); });

  var sinPlan = prox.filter(function(p){ return p._est==='Sin plan'; });
  var pedir = prox.filter(function(p){ return p._est==='Pedir turno'||p._est==='Vencido'; });
  var g = el('div',{cls:'grid g4'});
  g.appendChild(kpi('Unidades con plan', miles(vs.length - sinPlan.length), 'de '+vs.length));
  g.appendChild(kpi('Sin plan asignado', miles(sinPlan.length), 'no se les programa nada', sinPlan.length>0));
  g.appendChild(kpi('Hay que pedir turno', miles(pedir.length), 'dentro de la tolerancia', pedir.length>0));
  g.appendChild(kpi('Turnos pedidos', miles(T('PlanTurnos').filter(function(t){ return !/hecho|cerrad/i.test(String(t.estado||'')); }).length), 'esperando'));
  m.appendChild(g);

  var viajanSinPlan = {};
  T('Programados').forEach(function(v){ if(v.interno && !planDe(v.interno)) viajanSinPlan[v.interno]=1; });
  if(Object.keys(viajanSinPlan).length) m.appendChild(el('div',{cls:'aviso'},
    'Tráfico está programando unidades que no están en ningún plan: '+Object.keys(viajanSinPlan).join(', ')+'.'));

  carta(m, tabla(prox.map(function(p){ var o=Object.create(p); o._faltaTxt = p._falta===null?'—':miles(p._falta)+' km'; return o; }),
    [['interno','Interno','b'],['patente','Patente'],['base','Base'],['plan','Plan'],['_km','Odómetro','n'],
     ['_serv','Próximo'],['_faltaTxt','Faltan'],['_est','Estado','chip']],
    function(f){ if(unidad(f.interno)) fichaUnidad(f.interno); }), 'Próximos servicios · lo primero que hay que pedir está arriba');

  carta(m, tabla(ordenarPor(T('PlanTurnos'),'fecha'),
    [['fecha','Fecha','fecha'],['hora','Hora'],['interno','Interno','b'],['codigo','Servicio'],
     ['concesionario','Concesionario'],['predio','Predio'],['estado','Estado','chip']],
    function(f){ formGenerico('PlanTurnos', f); }), 'Turnos');

  carta(m, tabla(T('PlanMant'), [['nombre','Plan','b'],['marca','Marca'],['SERVICES (legible)','Servicios'],['notas','Notas']],
    function(f){ formGenerico('PlanMant', f); }), 'Planes cargados');
  carta(m, tabla(T('PlanUnidades'), [['interno','Interno','b'],['patente','Patente'],['predio','Predio'],
    ['kmManual','Km manual','n'],['ULTIMOS SERVICES (legible)','Últimos servicios']],
    function(f){ formGenerico('PlanUnidades', f); }), 'Unidades en plan');
}

function vistaOT(m){

  var enRuta = ots.filter(function(o){ return /ruta|contingencia/i.test(o.clase); });

  g.appendChild(kpi('Correctivas en ruta', miles(enRuta.length), 'fallas en servicio', enRuta.length>0));
  g.appendChild(kpi('% preventivo', (ots.length?Math.round(prev.length*100/ots.length):0)+'%', 'meta: más de 70%'));
  m.appendChild(g);

  var c = el('div',{cls:'card'});
  var barra = el('div',{style:'display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:12px'});
  var busca = el('input',{placeholder:'buscar por N° de O.T., interno o falla…', value:S.buscar||''});
  busca.addEventListener('input', function(e){ S.buscar=e.target.value; dib(); });
  var selE = el('select'); selE.appendChild(el('option',{value:''},'Todos los estados'));
  ((S.listas||{}).estado_ot||[]).forEach(function(x){ var o=el('option',{value:x},esc(x)); if(S.filtroEstado===x)o.selected=true; selE.appendChild(o); });
  selE.addEventListener('change', function(e){ S.filtroEstado=e.target.value; dib(); });
  var selC = el('select'); selC.appendChild(el('option',{value:''},'Todas las clases'));
  ((S.listas||{}).clase_ot||[]).forEach(function(x){ var o=el('option',{value:x},esc(x)); if(S.filtroClase===x)o.selected=true; selC.appendChild(o); });
  selC.addEventListener('change', function(e){ S.filtroClase=e.target.value; dib(); });
  barra.appendChild(busca); barra.appendChild(selE); barra.appendChild(selC);
  c.appendChild(barra);
  var caja = el('div'); c.appendChild(caja);
  var dib = function(){
    var q = normTexto(S.buscar||'');
    var f = ots.filter(function(o){
      if(S.filtroEstado && o.estado!==S.filtroEstado) return false;
      if(S.filtroClase && o.clase!==S.filtroClase) return false;
      if(!q) return true;
      return normTexto([o.numero,o.interno,o.patente,o.falla,o.responsable].join(' ')).indexOf(q)>=0;
    });
    caja.innerHTML='';
    caja.appendChild(tabla(ordenarPor(f,'fecha_apertura'),
      [['numero','O.T.','b'],['fecha_apertura','Apertura','fecha'],['interno','Interno'],['clase','Clase'],
       ['sector','Sector'],['estado','Estado','chip'],['costo_total','Costo','$']], fichaOT));
    caja.appendChild(el('div',{cls:'mini',style:'margin-top:8px'}, f.length+' de '+ots.length+' órdenes'));
  };
  dib();
  m.appendChild(c);
}

function vistaVehiculos(m){
  var sub = S.sub || 'unidades';
  encabezado(m,'Vehículos','Parque móvil y vencimientos', sub==='unidades'
    ? [btnMasiva('Vehiculos'), btnNuevo('Vehiculos','Nueva unidad',{estado:'Operativa'})]
    : [btnMasiva('Documentacion'), btnNuevo('Documentacion','Nuevo documento',{alcance:'Vehículo', estado:'Vigente'})]);
  tabs(m,[['unidades','Unidades'],['doc','Vencimientos y habilitaciones']], sub, function(v){ S.sub=v; pintar(); });
  var c = el('div',{cls:'card'});
  if(sub==='unidades'){
    var barra = el('div',{style:'display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px'});
    var busca = el('input',{placeholder:'buscar por interno, patente, marca o modelo…', value:S.buscar||''});
    busca.addEventListener('input', function(e){ S.buscar=e.target.value; dib(); });
    var selE = el('select',{style:'max-width:210px'});
    selE.appendChild(el('option',{value:''},'Todos los estados'));
    ['Operativa','En taller','Fuera de servicio','Reservada','Vendida'].forEach(function(x){
      var o=el('option',{value:x},esc(x)); if(S.filtroEstado===x)o.selected=true; selE.appendChild(o); });
    selE.addEventListener('change', function(e){ S.filtroEstado=e.target.value; dib(); });
    barra.appendChild(busca); barra.appendChild(selE); c.appendChild(barra);
    var caja = el('div'); c.appendChild(caja);
    var dib = function(){
      var q = normTexto(S.buscar||'');
      var filas = porEmpresa(T('Vehiculos')).filter(function(v){
        if(S.filtroEstado && v.estado!==S.filtroEstado) return false;
        if(!q) return true;
        return normTexto([v.vehiculo,v.patente,v.marca,v.modelo,v.base].join(' ')).indexOf(q)>=0;
      }).map(function(v){
        var o = Object.create(v), ps = proximoServicio(v), cons = consumoReal(v.vehiculo);
        o._km = kmActual(v.vehiculo);
        o._prox = ps ? (ps.codigo+' en '+miles(ps.falta)+' km') : '—';
        o._modelo = (v.marca||'')+' '+(v.modelo||'');
        o._consumo = cons ? cons.toFixed(1)+' L/100' : '—';
        if(cons && num(v.consumoRef)){
          var dd = (cons-num(v.consumoRef))/num(v.consumoRef);
          o._consumo += dd>.2 ? ' ▲' : (dd<-.1 ? ' ▼' : '');
        }
        return o;
      });
      caja.innerHTML='';
      caja.appendChild(tabla(filas, [['vehiculo','Interno','b'],['patente','Patente'],['_modelo','Marca y modelo'],
        ['base','Base'],['_km','Odómetro','n'],['_consumo','Consumo'],['_prox','Próximo servicio'],['estado','Estado','chip']],
        function(f){ fichaUnidad(f.vehiculo); }));
      caja.appendChild(el('div',{cls:'mini',style:'margin-top:8px'}, filas.length+' de '+porEmpresa(T('Vehiculos')).length+' unidades · ▲ consume más de 20% por encima de la referencia'));
    };
    dib();
  } else {
    var docs = vencimientos().map(function(v){
      var o = { ref:v.ref, tipo:v.tipo, vence:v.vence, origen:v.origen, _fila:v.fila };
      var dd = dias(hoy(), v.vence);
      o._plazo = isNaN(dd) ? '—' : (dd<0 ? 'vencido hace '+(-dd)+' d' : 'faltan '+dd+' d');
      o._est = isNaN(dd) ? '' : (dd<0 ? 'Vencido' : (dd<=30 ? 'Por vencer' : 'Vigente'));
      return o;
    });
    var vencidos = docs.filter(function(d){ return d._est==='Vencido'; }).length;
    var g = el('div',{cls:'grid g4', style:'margin-bottom:14px'});
    g.appendChild(kpi('Vencimientos', miles(docs.length), 'de unidades, choferes y papeles'));
    g.appendChild(kpi('Vencidos', miles(vencidos), 'meta: cero', vencidos>0));
    g.appendChild(kpi('Vencen en 30 días', miles(docs.filter(function(d){ return d._est==='Por vencer'; }).length), 'hay que sacar turno'));
    c.appendChild(g);
    c.appendChild(tabla(docs, [['ref','Unidad / persona','b'],['tipo','Documento'],['vence','Vence','fecha'],
      ['_plazo','Plazo'],['_est','Estado','chip'],['origen','Está cargado en']],
      function(f){ formGenerico(f.origen, f._fila); }));
  }
  m.appendChild(c);
}

function guardarFila(hoja, obj){
  if(!S.db[hoja]) S.db[hoja]=[];
  if(!obj.id) obj.id = idNuevo();
  var i = -1; S.db[hoja].forEach(function(r,k){ if(String(r.id)===String(obj.id)) i=k; });
  if(i>=0) S.db[hoja][i] = obj; else S.db[hoja].push(obj);
}
function borrarFila(hoja, obj){
  S.db[hoja] = (S.db[hoja]||[]).filter(function(r){ return String(r.id)!==String(obj.id); });
}

/* ---- formulario armado solo, a partir del esquema de la planilla ---- */
function campoDe(col, valor, alCambiar){
  var c = el('div',{cls:'campo'});
  c.appendChild(el('label',null, esc(col.titulo)));
  var ent;
  if(col.val && col.val.indexOf('l:')===0){
    ent = el('select');
    ent.appendChild(el('option',{value:''},'—'));
    ((S.listas||{})[col.val.substring(2)]||[]).forEach(function(v){
      var o = el('option',{value:v}, esc(v)); if(String(valor)===String(v)) o.selected=true; ent.appendChild(o);
    });
  } else if(col.val && col.val.indexOf('r:')===0){
    var p = col.val.substring(2).split('.');
    ent = el('select');
    ent.appendChild(el('option',{value:''},'—'));
    T(p[0]).forEach(function(r){
      var etiq = r[p[1]] + (r.nombre? ' · '+r.nombre : (r.descripcion? ' · '+r.descripcion : (r.razon_social? ' · '+r.razon_social : (r.patente? ' · '+r.patente:''))));
      var o = el('option',{value:r[p[1]]}, esc(etiq)); if(String(valor)===String(r[p[1]])) o.selected=true; ent.appendChild(o);
    });
  } else if(/^(obs|descripcion|falla|diagnostico|trabajo|detalle|no_conformes|sintoma|causa|solucion|alcance|permisos)$/.test(col.clave)){
    ent = el('textarea', null, esc(valor===undefined?'':valor));
  } else if(col.fmt==='e'||col.fmt==='n'||col.fmt==='$'||col.fmt==='%'){
    ent = el('input',{type:'number', step:(col.fmt==='e'?'1':'0.01'), value:(valor===''||valor===undefined?'':valor)});
  } else {
    ent = el('input',{value:(valor===undefined||valor===null?'':valor)});
    if(/fecha|vencimiento|emision|entrega|apertura|cierre|inicio|fin|despacho|recepcion$/.test(col.clave)) ent.placeholder='aaaa-mm-dd';
    if(/^hora/.test(col.clave)) ent.placeholder='hh:mm';
  }
  ent.addEventListener('change', function(e){ alCambiar(col.fmt==='t'? e.target.value : (e.target.value===''?'':num(e.target.value))); });
  ent.addEventListener('input', function(e){ alCambiar(col.fmt==='t'? e.target.value : (e.target.value===''?'':num(e.target.value))); });
  c.appendChild(ent);
  return c;
}

function formGenerico(hoja, registro, alTerminar){
  var esq = (S.esq||{})[hoja];
  if(!esq){ alert('Todavía no se descargó el esquema de la planilla. Apretá Actualizar.'); return; }
  var obj = {}; (registro? Object.keys(registro):[]).forEach(function(k){ obj[k]=registro[k]; });
  var nuevo = !registro || !registro.id;
  var cuerpo = el('div');
  cuerpo.appendChild(el('div',{cls:'mini',style:'margin-bottom:12px'}, esc(esq.desc||'')));
  var f = el('div',{cls:'fila'});
  esq.cols.forEach(function(col){
    if(col.clave==='id') return;
    f.appendChild(campoDe(col, obj[col.clave], function(v){ obj[col.clave]=v; }));
  });
  cuerpo.appendChild(f);

  var bots = [];
  if(!nuevo) bots.push(el('button',{cls:'btn', onclick:function(){
    if(!confirm('¿Borrar este registro de la hoja '+hoja+'?')) return;
    borrarFila(hoja, obj); guardar([hoja]); cerrarModal();
  }},'Borrar'));
  bots.push(el('button',{cls:'btn pri', onclick:function(){
    guardarFila(hoja, obj); guardar([hoja], function(){ alTerminar && alTerminar(obj); }); cerrarModal();
  }},'Guardar'));
  modal((nuevo?'Nuevo registro · ':'Editar · ')+hoja, cuerpo, bots);
}

function totalesOT(numero){
  var mo = T('OT_ManoObra').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  var ma = T('OT_Materiales').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  var te = T('OT_Terceros').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  return { mo:mo, ma:ma, te:te, total:mo+ma+te };
}

  cuerpo.appendChild(seccion('Mano de obra','OT_ManoObra',

function fila2(a,b){ return '<tr><td style="width:190px;color:var(--t3)">'+esc(a)+'</td><td><b>'+b+'</b></td></tr>'; }
function otPorNumero(n){ var r=null; T('OT').forEach(function(o){ if(o.numero===n) r=o; }); return r; }

function recalcularOT(numero, cerrar){
  var o = otPorNumero(numero); if(!o) return;
  var t = totalesOT(numero);
  o.costo_mo = t.mo; o.costo_materiales = t.ma; o.costo_terceros = t.te; o.costo_total = t.total;
  if(cerrar && o.estado!=='Cerrada'){
    if(!t.mo && !confirm('Esta O.T. no tiene horas de mano de obra cargadas. Sin horas el costo por km miente.\n\n¿La cerramos igual?')) return;
    o.estado = 'Cerrada'; o.fecha_cierre = hoy(); o.cerrada_por = S.usuario? S.usuario.nombre : '';
    if(!o.fecha_fin) o.fecha_fin = hoy();
    var v = unidad(o.interno); if(v && v.estado==='En taller'){ v.estado='Operativa'; guardarFila('Vehiculos', v); }
  }
  guardarFila('OT', o);
  guardar(['OT','Vehiculos'], function(){ fichaOT(otPorNumero(numero)); });
}

/* --------------------------- VALE DE CONSUMO ------------------------- */
function abrirVale(ot){
  var stk = stockLista();
  /* si está mirando "todas las empresas", el vale igual tiene que salir de un pañol concreto */
  var empresa = (ot? ot.empresa : (S.empresa!=='*'?S.empresa:'')) || (S.usuario&&S.usuario.empresa) || ((T('Empresas')[0]||{}).codigo||'');

  if(!base || !T('Bases').some(function(b){ return b.codigo===base && b.empresa===empresa; })){
    var b0 = T('Bases').filter(function(b){ return b.empresa===empresa; })[0];
    base = b0 ? b0.codigo : base;
  }
  var renglones = [{ articulo:'', cantidad:1 }];
  var destinoOT = ot ? ot.numero : '';
  var interno = ot ? ot.interno : '';

  var dibujar = function(){
    cuerpo.innerHTML = '';
    var enc = el('div',{cls:'fila'});
    var selEmp = el('select'); T('Empresas').forEach(function(e){ var o=el('option',{value:e.codigo}, esc(e.nombre)); if(e.codigo===empresa) o.selected=true; selEmp.appendChild(o); });
    selEmp.addEventListener('change', function(e){ empresa=e.target.value;
      if(!T('Bases').some(function(b){ return b.codigo===base && b.empresa===empresa; })){
        var b0=T('Bases').filter(function(b){ return b.empresa===empresa; })[0]; base = b0?b0.codigo:'';
      }
      dibujar(); });
    enc.appendChild(el('div',{cls:'campo'},'<label>Empresa del stock</label>').appendChild(selEmp).parentNode);
    var selBase = el('select'); T('Bases').filter(function(b){ return !empresa||b.empresa===empresa; }).forEach(function(b){ var o=el('option',{value:b.codigo}, esc(b.nombre)); if(b.codigo===base) o.selected=true; selBase.appendChild(o); });
    selBase.addEventListener('change', function(e){ base=e.target.value; dibujar(); });
    enc.appendChild(el('div',{cls:'campo'},'<label>Base que entrega</label>').appendChild(selBase).parentNode);
    var selOT = el('select'); selOT.appendChild(el('option',{value:''},'— sin O.T. —'));
    T('OT').filter(function(o){ return o.estado!=='Cerrada'&&o.estado!=='Anulada'; }).forEach(function(o){
      var op=el('option',{value:o.numero}, esc(o.numero+' · interno '+o.interno)); if(o.numero===destinoOT) op.selected=true; selOT.appendChild(op); });
    selOT.addEventListener('change', function(e){ destinoOT=e.target.value; var o=otPorNumero(destinoOT); if(o) interno=o.interno; dibujar(); });
    enc.appendChild(el('div',{cls:'campo'},'<label>Orden de trabajo</label>').appendChild(selOT).parentNode);
    var inpInt = el('input',{value:interno, placeholder:'interno'});
    inpInt.addEventListener('input', function(e){ interno=e.target.value; });
    enc.appendChild(el('div',{cls:'campo'},'<label>Interno (a quién se le carga)</label>').appendChild(inpInt).parentNode);
    cuerpo.appendChild(enc);

    var v = unidad(interno);
    if(v && empresa && empCod(v) !== empresa)
      cuerpo.appendChild(el('div',{cls:'aviso'},'Préstamo entre empresas: el material sale del pañol de '+esc(empresa)+' y lo paga '+esc(empCod(v))+', dueña del coche.'));

    renglones.forEach(function(r, i){
      var caja = el('div',{style:'border:1px solid var(--linea);border-radius:10px;padding:12px;margin-bottom:10px'});
      var f = el('div',{cls:'fila'});
      var sel = el('select');
      sel.appendChild(el('option',{value:''},'— elegir artículo —'));
      T('Articulos').forEach(function(a){
        var s = stk.filter(function(x){ return x.articulo===a.codigo && x.empresa===empresa && x.base===base; })[0];
        var op = el('option',{value:a.codigo}, esc(a.codigo+' · '+a.descripcion+' · hay '+(s?miles(s.cant):'0')+' '+(a.um||'')));
        if(r.articulo===a.codigo) op.selected=true; sel.appendChild(op);
      });

      f.appendChild(el('div',{cls:'campo'},'<label>Artículo</label>').appendChild(sel).parentNode);
      var inpC = el('input',{type:'number', step:'0.01', value:r.cantidad});

      f.appendChild(el('div',{cls:'campo'},'<label>Cantidad que sale</label>').appendChild(inpC).parentNode);

      if(r.articulo){

  var comb = T('Combustible').filter(function(c){ return internoDe(c)===String(interno); });
  var litros = comb.reduce(function(a,c){ return a+num(c.litros); },0);
  var kmMes = kmDelPeriodo(interno);
  var costoOT = ots.reduce(function(a,o){ return a+num(o.costo_total); },0);
  var cuerpo = el('div');

function normTexto(s){
  return String(s===undefined||s===null?'':s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}

/* clave natural de cada hoja, para no duplicar al reimportar */
var CLAVE_HOJA = { Vehiculos:'vehiculo', Conductores:'dni', Personal:'legajo', Articulos:'codigo',
  Proveedores:'codigo', Empresas:'codigo', Bases:'codigo', OT:'numero', Neumaticos:'fuego' };

function separadorDe(linea){
  var c = { ';':0, ',':0, '\t':0, '|':0 };
  for(var i=0;i<linea.length;i++) if(c[linea[i]]!==undefined) c[linea[i]]++;
  var mejor=';', max=-1;
  Object.keys(c).forEach(function(k){ if(c[k]>max){ max=c[k]; mejor=k; } });
  return max>0 ? mejor : ';';
}
function parseCSV(texto){
  texto = texto.replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var lineas = texto.split('\n').filter(function(l){ return l.trim()!==''; });
  if(!lineas.length) return [];
  var sep = separadorDe(lineas[0]);
  return lineas.map(function(l){
    var out=[], act='', comillas=false;
    for(var i=0;i<l.length;i++){
      var ch=l[i];
      if(ch==='"'){ if(comillas && l[i+1]==='"'){ act+='"'; i++; } else comillas=!comillas; }
      else if(ch===sep && !comillas){ out.push(act.trim()); act=''; }
      else act+=ch;
    }
    out.push(act.trim());
    return out;
  });
}
function leerArchivo(file, cb, cbErr){
  var nombre = (file.name||'').toLowerCase();
  var r = new FileReader();
  if(/\.(xlsx|xlsm|xls)$/.test(nombre)){
    if(typeof XLSX === 'undefined') return cbErr('Para leer Excel hace falta internet la primera vez. Guardalo como CSV y probá de nuevo.');
    r.onload = function(e){
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        var hoja = wb.Sheets[wb.SheetNames[0]];
        var filas = XLSX.utils.sheet_to_json(hoja, {header:1, raw:false, defval:''});
        cb(filas.filter(function(f){ return f.some(function(c){ return String(c).trim()!==''; }); }));
      }catch(err){ cbErr('No se pudo leer el Excel: '+err.message); }
    };
    r.readAsArrayBuffer(file);
  } else {
    r.onload = function(e){
      var txt = e.target.result;
      /* los reportes viejos vienen en Latin-1 y rompen los acentos */
      if(/Ã|Â/.test(txt)){ try{ txt = new TextDecoder('windows-1252').decode(new TextEncoder().encode(txt)); }catch(x){} }
      cb(parseCSV(txt));
    };
    r.readAsText(file, 'utf-8');
  }
}

function mapearEncabezados(hoja, encabezados){
  var cols = ((S.esq||{})[hoja]||{cols:[]}).cols;
  var alias = ALIAS[hoja] || {};
  var mapa = [];
  encabezados.forEach(function(h){
    var n = normTexto(h), elegida = '';
    cols.forEach(function(c){
      if(elegida) return;
      if(n === normTexto(c.clave) || n === normTexto(c.titulo)) elegida = c.clave;
    });
    if(!elegida) Object.keys(alias).forEach(function(k){
      if(elegida) return;
      if(alias[k].some(function(a){ return normTexto(a) === n; })) elegida = k;
    });
    if(!elegida) cols.forEach(function(c){
      if(elegida) return;
      var t = normTexto(c.titulo);
      if(n && (t.indexOf(n)===0 || n.indexOf(t)===0)) elegida = c.clave;
    });
    mapa.push({ origen:h, destino:elegida });
  });
  return mapa;
}

function importarMasivo(hoja, opciones){
  opciones = opciones || {};
  var cols = ((S.esq||{})[hoja]||{cols:[]}).cols;
  if(!cols.length){ alert('Todavía no bajó el esquema de la planilla. Apretá Actualizar.'); return; }
  var clave = opciones.clave || CLAVE_HOJA[hoja] || '';
  var estado = { filas:null, mapa:null, listas:null, actualizar:true, avisos:[], corregirKm:false };

  var cuerpo = el('div');
  var dibujar = function(){
    cuerpo.innerHTML = '';
    if(!estado.filas){
      var zona = el('div',{cls:'soltar'},'<b>Soltá acá el archivo</b>CSV, TSV o Excel (.xlsx). También podés hacer clic y elegirlo.');
      var inp = el('input',{type:'file', accept:'.csv,.txt,.tsv,.xlsx,.xlsm,.xls', style:'display:none'});
      inp.addEventListener('change', function(e){ if(e.target.files[0]) cargar(e.target.files[0]); });
      zona.addEventListener('click', function(){ inp.click(); });
      zona.addEventListener('dragover', function(e){ e.preventDefault(); });
      zona.addEventListener('drop', function(e){ e.preventDefault(); if(e.dataTransfer.files[0]) cargar(e.dataTransfer.files[0]); });
      cuerpo.appendChild(zona); cuerpo.appendChild(inp);
      cuerpo.appendChild(el('div',{cls:'mini',style:'margin-top:12px'},
        'La primera fila tiene que ser la de los títulos. Reconozco los nombres de los reportes que ya usás (dominio, kilometraje, nro doc, fecha fin vigencia…). El separador lo detecto solo: punto y coma, coma o tabulación.'));
      return;
    }
    /* mapeo */
    var m = el('div',{cls:'mapeo'});
    m.innerHTML = '<b style="color:var(--t2)">Columnas reconocidas:</b><br>';
    estado.mapa.forEach(function(x, i){
      var c = cols.filter(function(c){ return c.clave===x.destino; })[0];
      var sp = el('span', x.destino?{}:{cls:'no'});
      sp.innerHTML = esc(x.origen||'(sin título)') + ' → ' + (c ? esc(c.titulo) : 'se ignora');
      sp.style.cursor='pointer';
      sp.addEventListener('click', function(){
        var opts = cols.map(function(c){ return c.clave; });
        var elegido = prompt('¿A qué columna va "'+x.origen+'"?\n\n'+opts.join(', ')+'\n\n(vacío = ignorar)', x.destino||'');
        if(elegido!==null){ estado.mapa[i].destino = elegido.trim(); recalcular(); }
      });
      m.appendChild(sp);
    });
    cuerpo.appendChild(m);

    estado.avisos.forEach(function(a){ cuerpo.appendChild(el('div',{cls:a.nivel==='mal'?'err':'aviso'}, a.txt)); });

    if(estado.corregirKm){
      cuerpo.appendChild(el('button',{cls:'btn chico', style:'margin-bottom:10px', onclick:function(){
        estado.listas.forEach(function(r){ if(r._kmChico) { r[r._kmCampo] = num(r[r._kmCampo])*1000; r._kmChico=false; } });
        recalcular(true); }},'Corregir los kilómetros (×1000)'));
    }

    var op = el('div',{style:'display:flex;gap:14px;align-items:center;margin:10px 0;flex-wrap:wrap'});
    if(clave){
      var chk = el('input',{type:'checkbox', style:'width:auto'}); chk.checked = estado.actualizar;
      chk.addEventListener('change', function(e){ estado.actualizar=e.target.checked; recalcular(); });
      var lab = el('label',{style:'display:flex;gap:7px;align-items:center;text-transform:none;font-size:12.5px;color:var(--t2)'});
      lab.appendChild(chk); lab.appendChild(document.createTextNode('Actualizar los que ya existen (por '+clave+') en vez de duplicarlos'));
      op.appendChild(lab);
    }
    cuerpo.appendChild(op);

    var nuevos = estado.listas.filter(function(r){ return !r._existe; }).length;
    var actual = estado.listas.length - nuevos;
    cuerpo.appendChild(el('div',{cls:'mini',style:'margin-bottom:8px'},
      '<b style="color:var(--t1)">'+estado.listas.length+' filas leídas</b> · '+nuevos+' nuevas'+(clave?' · '+actual+' ya existen':'')));

    var usadas = estado.mapa.filter(function(x){ return x.destino; }).map(function(x){ return x.destino; });
    var vista = estado.listas.slice(0,8);
    cuerpo.appendChild(tabla(vista, usadas.slice(0,8).map(function(k){
      var c = cols.filter(function(c){ return c.clave===k; })[0];
      return [k, c?c.titulo:k, (c&&c.fmt!=='t')?'n':'t'];
    })));
  };

  var recalcular = function(sinRevalidar){
    var enc = estado.filas[0];
    if(!sinRevalidar) estado.mapa = estado.mapa || mapearEncabezados(hoja, enc);
    var listas = [], avisos = [], corregir = false;
    var existentes = {};
    if(clave) T(hoja).forEach(function(r){ existentes[normTexto(r[clave])] = r; });

    for(var i=1;i<estado.filas.length;i++){
      var f = estado.filas[i], o = {};
      estado.mapa.forEach(function(x, k){
        if(!x.destino) return;
        var c = cols.filter(function(c){ return c.clave===x.destino; })[0];
        var v = f[k];
        o[x.destino] = (c && c.fmt!=='t') ? num(v) : String(v===undefined?'':v).trim();
      });
      if(!Object.keys(o).length) continue;
      if(!Object.keys(o).some(function(k){ return String(o[k]).trim()!==''; })) continue;
      /* si la hoja apunta por vehiculo_id, lo resolvemos desde la patente o el interno */
      if(cols.some(function(c){ return c.clave==='vehiculo_id'; })){
        var vv = unidadDe({ patente:o.Patente||o.patente||o.dominio, interno:o.Unidad||o.interno, vehiculo_id:o.vehiculo_id });
        if(vv){ o.vehiculo_id = vv.id; if(cols.some(function(c){ return c.clave==='Unidad'; })) o.Unidad = vv.vehiculo;
                if(cols.some(function(c){ return c.clave==='Patente'; })) o.Patente = vv.patente;
                if(!o.empresa_id && cols.some(function(c){ return c.clave==='empresa_id'; })) o.empresa_id = vv.empresa_id; }
        else if(o.Patente||o.patente) avisos.push({nivel:'al', txt:'La fila '+(i+1)+' trae la patente '+esc(o.Patente||o.patente)+' y esa unidad no está dada de alta. Se carga igual, pero conviene crearla en Vehículos.'});
      }
      if(cols.some(function(c){ return c.clave==='conductor_id'; }) && (o.DNI || o.dni)){
        var cc = IX.condDni[String(o.DNI||o.dni)];
        if(cc){ o.conductor_id = cc.id; if(cols.some(function(x){ return x.clave==='Conductor'; })) o.Conductor = cc.nombre; }
      }
      if(clave && o[clave]!==undefined){
        var ya = existentes[normTexto(o[clave])];
        if(ya){ o._existe = true; o.id = ya.id; }
      }
      /* control de odómetro: el clásico 446.000 que entra como 446 */
      ['odometro','km','km_carga','kmFinal','kmsFinales','kmManual'].forEach(function(campo){
        if(o[campo]===undefined || !num(o[campo])) return;
        var interno = o.vehiculo || o.interno || (o.patente ? String((IX.vehPat[normTexto(o.patente)]||{}).vehiculo||'') : '');
        var kmv = interno ? kmActual(interno) : 0;
        if(kmv && num(o[campo]) * 500 < kmv){ o._kmChico = true; o._kmCampo = campo; corregir = true; }
        if(kmv && num(o[campo]) > kmv * 50) avisos.push({nivel:'al', txt:'La fila '+(i+1)+' trae un kilometraje enorme ('+miles(o[campo])+'). Revisá que la columna no esté corrida.'});
      });
      listas.push(o);
    }
    if(corregir) avisos.unshift({ nivel:'mal', txt:'Hay kilometrajes que dan mil veces más chicos que el odómetro de la unidad. Suele ser el punto de miles leído como decimal ("446.000" entrando como 446). Corregilos antes de importar.' });
    if(!estado.mapa.some(function(x){ return x.destino; })) avisos.push({nivel:'mal', txt:'No reconocí ninguna columna. Hacé clic en un título para asignarlo a mano.'});
    estado.listas = listas; estado.avisos = avisos; estado.corregirKm = corregir;
    dibujar();
  };

  var cargar = function(file){
    leerArchivo(file, function(filas){
      if(filas.length<2){ alert('El archivo no tiene filas debajo del encabezado.'); return; }
      estado.filas = filas; estado.mapa = mapearEncabezados(hoja, filas[0]);
      recalcular(true);
    }, function(err){ alert(err); });
  };

  dibujar();
  var confirmar = el('button',{cls:'btn pri', onclick:function(){
    if(!estado.listas || !estado.listas.length){ alert('Todavía no cargaste el archivo.'); return; }
    if(estado.corregirKm && !confirm('Hay kilometrajes que parecen divididos por mil. ¿Importar igual?')) return;
    var n = 0;
    estado.listas.forEach(function(r){
      var o = {};
      Object.keys(r).forEach(function(k){ if(k.indexOf('_')!==0) o[k]=r[k]; });
      if(r._existe && estado.actualizar){
        var ya = (T(hoja).filter(function(x){ return String(x.id)===String(r.id); })[0]) || {};
        Object.keys(ya).forEach(function(k){ if(o[k]===undefined || o[k]==='') o[k]=ya[k]; });
      } else if(r._existe && !estado.actualizar){ return; }
      else { o.id = idNuevo(); if(opciones.base) Object.keys(opciones.base).forEach(function(k){ if(!o[k]) o[k]=opciones.base[k]; }); }
      guardarFila(hoja, o); n++;
    });
    guardar([hoja], function(){ alert('Se importaron '+n+' filas a '+hoja+'.'); });
    cerrarModal();
  }},'Importar');
  modal('Carga masiva · '+hoja, cuerpo, [confirmar], 'ancho');
}

/* ------------------------- logo de la empresa ------------------------ */
function logoDe(codigo){ try{ return JSON.parse(localStorage.getItem('GF_LOGOS')||'{}')[codigo]||''; }catch(e){ return ''; } }
function subirLogo(codigo, cb){
  var inp = el('input',{type:'file', accept:'image/*', style:'display:none'});
  inp.addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var c = document.createElement('canvas');
        var esc2 = Math.min(1, 320/img.width);
        c.width = img.width*esc2; c.height = img.height*esc2;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var datos = {}; try{ datos = JSON.parse(localStorage.getItem('GF_LOGOS')||'{}'); }catch(x){}
        datos[codigo] = c.toDataURL('image/png');
        try{ localStorage.setItem('GF_LOGOS', JSON.stringify(datos)); }catch(x){ alert('El logo es muy pesado para el navegador.'); }
        cb && cb(); pintar();
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
}

  pintar();
  if(S.api){
    traer(function(){
      var u = localStorage.getItem(LS.ses);
      if(u) T('Usuarios').forEach(function(x){ if(x.usuario===u && x.activo!=='No') S.usuario=x; });
      pintar();
    });
    apiGet({accion:'esquema'}, function(j){ S.esq=j.esquema; S.listas=j.listas; pintar(); }, function(){});
  }
}
